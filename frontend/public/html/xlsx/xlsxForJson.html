<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xlsx-json</title>

</head>
<body>

    <input type="file" id="arquivo">
    <button id="btn">Enviar</button>
    <script type="module">

        const arquivoInput = document.querySelector('#arquivo')
        const btn = document.querySelector('#btn')        

        btn.addEventListener('click', async (e) => {
           
            e.preventDefault()

            try {

                const arquivo = arquivoInput.files[0]
                
                const formData = new FormData();
                formData.append('arquivo', arquivo);

                console.log('Enviando arquivo para o servidor...')

                //* response recebe o tipo 'blob' do servidor
                const response = await fetch(`/xlsx-json`, {
                    method: "POST",
                    body: formData
                });

                console.log('Resposta do servidor:', response);
                
                /*
                 * Converte a resposta da API em um objeto Blob 
                 * O Blob contém os dados do arquivo JSON convertido pelo servidor
                 * e preserva metadados como tipo MIME e tamanho do arquivo
                 */
                const blob  = await response.blob();

                //cria URL para download
                const url = window.URL.createObjectURL(blob)
                const link = document.createElement('a');
                link.href = url;
                link.download = 'arquivo_convertido.json';
                document.body.appendChild(link)
                link.click();
                document.body.removeChild(link)
                window.URL.revokeObjectURL(url)


            } catch (error) {
                console.error(`Error no servidor:`, error)
            }      
        
        })

    </script>    
</body>
</html>
