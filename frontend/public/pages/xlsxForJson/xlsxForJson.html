<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xlsx-json</title>

</head>
<body>

    <input type="file" id="arquivo">
    <button id="btn">Enviar</button>
    <script type="module">

        import Arquivo from '../../shared/js/models/Arquivo.js'  
        import geraDownload from '../../shared/js/utils/geraDownload.js'   

        const arquivoInput = document.querySelector('#arquivo')
        const btn = document.querySelector('#btn')   
        const ENDPOINT_XLSX_JSON = '/xlsx-json'        

        btn.addEventListener('click', async (e) => {
           
            e.preventDefault()

            try {
                const arquivo = new Arquivo(arquivoInput.files[0])

                arquivo.verificaExtensao(arquivo.extensoesPermitidas['XLSX'])

                const arquivoConvertido = await arquivo.realizaConversao(ENDPOINT_XLSX_JSON)

                geraDownload(arquivoConvertido, 'arquivo_convertido.json')

            } catch (error) {
                if(error.message.includes('Failed to fetch')) {
                    alert('Servidor Indisponível')
                    throw new Error ('Servidor Indisponível')
                }
                alert(error.message)
            }
        })

    </script>    
</body>
</html>
